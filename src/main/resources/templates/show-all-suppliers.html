<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
	
    
    <h2 class="mb-4">List of Suppliers</h2>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Supplier Name</th>
           <th>Supplier Email</th>
            <th>Contact Number</th>
            <th>Date Of Establisment</th>
            <th>Supplier City</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="supplier : ${suppliers}">
            <td th:text="${supplier.supplierName}"></td>
            <td th:text="${supplier.supplierEmail}"></td> 
            <td th:text="${supplier.supplierContactNumber}"></td>
            <td th:text="${supplier.dateOfEstablisment}"></td>
            <td th:text="${supplier.supplierCity}"></td>
           
            
        </tr>
        </tbody>
    </table>
</div>
</body>

</html>
