<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<a th:href="@{/supplier/addSupplierForm}" class="btn btn-secondary btn-sm">Add Supplier</a>
<div class="container mt-5">
	
    
    <h2 class="mb-4">List of Suppliers</h2>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Supplier Name</th>
            <th>Supplier Email</th>
            <th>Contact Number</th>
            <th>Date Of Establishment</th>
            <th>Supplier City</th>
            <th>Delete</th>
            <th>Update</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="supplier : ${suppliers}">
            <td th:text="${supplier.supplierName}"></td>
            <td th:text="${supplier.supplierEmail}"></td> 
            <td th:text="${supplier.supplierContactNumber}"></td>
            <td th:text="${supplier.dateOfEstablisment}"></td>
            <td th:text="${supplier.supplierCity}"></td>
           <td><a th:href="@{'/supplier/deletSupplier/' + ${supplier.supplierId}}" class="btn btn-danger btn-sm" 
               onclick="return confirm('Are you sure you want to delete this product?');">Delete</a> </td>
               
    <td><a th:href="@{'/supplier/updateSupplierForm/' + ${supplier.supplierId}}" class="btn btn-primary btn-sm" >Update</a></td>
           
            
        </tr>
        </tbody>
    </table>
</div>
</body>

</html>
